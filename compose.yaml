x-reviewer: &reviewer
  platform: linux/amd64
  image: ${REVIEW_IMAGE:-assay-pr-agent:local}
  build: .
  # The image writes only to its volumes and /tmp; keep the rest of the rootfs read-only.
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  # exec matches the k8s emptyDir (which cannot be noexec) and the CI test run.
  tmpfs:
    - /tmp:mode=1777,size=1g,exec
services:
  setup:
    <<: *reviewer
    stdin_open: true
    tty: true
    logging:
      driver: "none"
    restart: on-failure
    command: [manage]
    ports: ["127.0.0.1:8765:8765"]
    volumes: ["state:/state", "repos:/repos:ro", "provider-login:/model-auth"]
    environment:
      REVIEW_LOGIN_DIR: /model-auth
      REVIEW_SETUP_BIND: 0.0.0.0
  sync:
    <<: *reviewer
    command: [sync]
    environment:
      REVIEW_WATCH_SETUP: "1"
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/sync-ready"]
      interval: 5s
      timeout: 3s
      retries: 60
    restart: unless-stopped
    volumes: ["state:/state", "repos:/repos"]
  reviewer:
    <<: *reviewer
    environment:
      REVIEW_WATCH_SETUP: "1"
      REVIEW_LOGIN_DIR: /model-auth
    restart: unless-stopped
    volumes: ["state:/state", "repos:/repos:ro", "provider-login:/model-auth"]
    depends_on:
      sync:
        condition: service_started
volumes:
  provider-login:
  state:
  repos:
