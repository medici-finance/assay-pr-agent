[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cursor-pr-review"
version = "0.1.0"
description = "Single-pass Cursor reviewer for GitHub pull requests and GitLab merge requests"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["pr-agent==0.50.0", "httpx"]

[project.scripts]
cursor-review-setup = "cursor_pr.setup:main"
cursor-review-container = "cursor_pr.poll:container_main"
cursor-review-poll = "cursor_pr.poll:main"
cursor-review = "cursor_pr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cursor_pr = ["setup.html", "setup.css", "setup.js"]
