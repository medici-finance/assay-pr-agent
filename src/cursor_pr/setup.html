<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reviewer setup · Assay PR Agent</title><link rel="stylesheet" href="/setup.css"><script defer src="/setup.js"></script></head>
<body><header><span aria-hidden="true" class="mark">/</span> Assay PR Agent</header><main>
<h1>Reviewer setup</h1><p id="message" aria-live="polite">Connecting to the local installer…</p>
<form id="registration" method="post" target="_blank" rel="noopener noreferrer" hidden>
<input type="hidden" name="manifest"><button type="submit">Register App on GitHub</button></form>
<a id="external" target="_blank" rel="noopener noreferrer" hidden>Install GitHub App</a>
<form id="unlock" method="post" action="/login" autocomplete="off" hidden><label for="secret">Setup key</label>
<input id="secret" type="password" autocomplete="off" spellcheck="false">
<div class="actions"><button type="submit">Unlock</button><button type="button" id="reprint" class="secondary">Print key to console</button></div></form>
<form id="questions" hidden><label id="question" for="answer"></label><input id="answer" autocomplete="off" spellcheck="false">
<textarea id="multi" aria-labelledby="question" rows="6" hidden></textarea>
<select id="choices" aria-labelledby="question" hidden></select>
<label id="upload" hidden>Choose a local file<input id="file" type="file"></label>
<div class="actions"><button type="submit">Continue <span aria-hidden="true">→</span></button></div></form>
<button type="button" id="quit" hidden>Quit setup</button>
</main></body></html>
