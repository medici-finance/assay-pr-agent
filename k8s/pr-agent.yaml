apiVersion: v1
kind: Namespace
metadata:
  name: pr-agent
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pr-agent-state
  namespace: pr-agent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pr-agent-repos
  namespace: pr-agent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pr-agent-model-auth
  namespace: pr-agent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pr-agent
  namespace: pr-agent
  labels:
    app.kubernetes.io/name: pr-agent
spec:
  replicas: 1
  strategy:
    # All three volumes are ReadWriteOnce; recreate instead of rolling.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pr-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pr-agent
      annotations:
        kubectl.kubernetes.io/default-container: setup
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      # imagePullSecrets:
      #   - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        # Attachable setup manager, equivalent to compose service "setup".
        - name: setup
          image: ghcr.io/medici-finance/assay-pr-agent:main
          imagePullPolicy: Always
          # Restart the manager in place if stdin closes, like compose's
          # restart: unless-stopped, without bouncing the whole pod.
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                cursor-review-container manage
                sleep 1
              done
          stdin: true
          tty: true
          ports:
            - name: setup
              containerPort: 8765
          env:
            - name: REVIEW_STATE_DIR
              value: /state
            - name: REVIEW_LOGIN_DIR
              value: /model-auth
            - name: REVIEW_SETUP_BIND
              value: 0.0.0.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: state
              mountPath: /state
            - name: repos
              mountPath: /repos
              readOnly: true
            - name: model-auth
              mountPath: /model-auth
        # Repository sync sidecar, equivalent to compose service "sync".
        - name: sync
          image: ghcr.io/medici-finance/assay-pr-agent:main
          imagePullPolicy: Always
          args: ["sync"]
          env:
            - name: REVIEW_STATE_DIR
              value: /state
            - name: REVIEW_WATCH_SETUP
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: state
              mountPath: /state
            - name: repos
              mountPath: /repos
        # Reviewer, equivalent to compose service "reviewer".
        - name: reviewer
          image: ghcr.io/medici-finance/assay-pr-agent:main
          imagePullPolicy: Always
          env:
            - name: REVIEW_STATE_DIR
              value: /state
            - name: REVIEW_WATCH_SETUP
              value: "1"
            - name: REVIEW_LOGIN_DIR
              value: /model-auth
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: state
              mountPath: /state
            - name: repos
              mountPath: /repos
              readOnly: true
            - name: model-auth
              mountPath: /model-auth
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: pr-agent-state
        - name: repos
          persistentVolumeClaim:
            claimName: pr-agent-repos
        - name: model-auth
          persistentVolumeClaim:
            claimName: pr-agent-model-auth
---
apiVersion: v1
kind: Service
metadata:
  name: pr-agent
  namespace: pr-agent
  labels:
    app.kubernetes.io/name: pr-agent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pr-agent
  ports:
    - name: setup
      port: 8765
      targetPort: setup
