# Point Flux at the k8s/ directory in your Git repository.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pr-agent
  namespace: flux-system
spec:
  interval: 10m
  path: ./k8s
  prune: true
  wait: true
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system   # your GitRepository name
