publish-container:
  image: docker:28-cli
  services:
    - name: docker:28-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: '1'
    DOCKER_CERT_PATH: /certs/client
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG)'
  resource_group: container-$CI_COMMIT_REF_SLUG
  script:
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - export IMAGE_REPOSITORY="$CI_REGISTRY_IMAGE" SOURCE_URL="$CI_PROJECT_URL" COMMIT_SHA="$CI_COMMIT_SHA" REF_NAME="$CI_COMMIT_REF_NAME"
    - if [ -n "${CI_COMMIT_TAG:-}" ]; then export REF_KIND=tag; else export REF_KIND=branch; fi
    - ci/publish-image.sh
